version: '3.8'

services:

  oracle-db:
    image: gvenzl/oracle-xe:11-slim
    container_name: oracle-db

    environment:
      ORACLE_PASSWORD: Shajith77 

    ports:
      - "1521:1521"

    volumes:
      - oracle-data:/opt/oracle/oradata

  springboot-app:

    build: .

    container_name: schoolmanagement-app

    ports:
      - "8000:8000"

    depends_on:
      - oracle-db

    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle-db:1521/xe
      SPRING_DATASOURCE_USERNAME: Fakhrudeen77
      SPRING_DATASOURCE_PASSWORD: Shajith77

volumes:
  oracle-data: